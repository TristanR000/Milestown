<style>
/* Layout: de pixelstad vult het scherm; menu's zijn Pokémon-achtige tekstvakken (onderbalk + bottom sheet op mobiel, zijpaneel op desktop). Eén vaste daglook. */
:root {
  --grass: #8ccc6c;
  --ink: #383848;
  --ink-soft: #62627a;
  --box: #fbfbf8;
  --box-2: #eef2f6;
  --rim: #a8c8e0;
  --line: #d8dce6;
  --accent: #e04848;
  --go: #3a8a4a;
  --gold: #f0c040;
  --pixel: "Pixelify Sans", "Courier New", monospace;
  --font: "Nunito", "Segoe UI", system-ui, sans-serif;
  --scrim: rgba(40, 48, 64, .45);
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--grass); color: var(--ink); font-family: var(--font); font-size: 15px; font-weight: 700; overflow: hidden; touch-action: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; image-rendering: pixelated; }
#world.dragging { cursor: grabbing; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.ink-box, #sheet, .modal { background: var(--box); border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px var(--rim), 0 4px 0 rgba(40, 48, 64, .28); }
canvas { image-rendering: pixelated; }

#hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none;
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
#cityChip { pointer-events: auto; display: flex; align-items: center; gap: 12px; border-radius: 10px; padding: 8px 16px; max-width: 100%; }
#cityName { font-family: var(--pixel); font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.stat { display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; font-weight: 900; white-space: nowrap; }
.stat small { font-weight: 700; color: var(--ink-soft); font-size: 12px; }
.dot { width: 4px; height: 4px; background: var(--rim); flex: none; }

#toolbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px;
  padding: 6px; border-radius: 10px; z-index: 5; max-width: calc(100% - 32px); box-sizing: border-box; }
.tool { border: 0; background: transparent; padding: 8px 13px; border-radius: 6px; font-family: var(--pixel); font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tool svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; }
.tool:hover { background: var(--box-2); }
.tool[aria-pressed="true"] { background: var(--ink); color: #fff; }
@media (max-width: 420px) { .tool { padding: 8px 9px; font-size: 15px; gap: 5px; } .tool svg { width: 16px; height: 16px; } }

#placebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; width: min(380px, calc(100% - 32px)); box-sizing: border-box; }
#placebar p { margin: 0 4px; font-size: 13px; color: var(--ink-soft); }
#placebar .row { display: flex; gap: 8px; }
#placebar .row > * { flex: 1; }
#buildhint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(66px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--ink); color: #fff;
  padding: 7px 14px; border-radius: 8px; font-weight: 800; font-size: 13px; max-width: calc(100% - 32px); text-align: center; }

.btn { border: 3px solid var(--ink); border-radius: 8px; padding: 8px 15px; font-family: var(--pixel); font-size: 16px; font-weight: 600; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.btn:hover { background: var(--box-2); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: #ec5a5a; }
.btn.ghost { border-color: var(--ink); background: var(--box); }
.btn.small { padding: 5px 11px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }

#sheet { position: fixed; z-index: 8; display: flex; flex-direction: column; }
@media (max-width: 759px) {
  #sheet { left: 0; right: 0; bottom: 0; max-height: 78%; border-radius: 14px 14px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
}
@media (min-width: 760px) {
  #sheet { top: 14px; right: 14px; bottom: 14px; width: 400px; border-radius: 14px; animation: side .18s ease-out; }
  @keyframes side { from { transform: translateX(30px); opacity: 0; } }
}
@media (prefers-reduced-motion: reduce) { #sheet { animation: none; } }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 12px max(18px, env(safe-area-inset-left, 0px)); border-bottom: 3px dashed var(--line); }
.sheet-head h2 { margin: 0; font-family: var(--pixel); font-size: 24px; font-weight: 700; line-height: 1.05; text-wrap: balance; }
.sheet-head .sub { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.sheet-head .grow { flex: 1; min-width: 0; }
.close { border: 3px solid var(--ink); background: #fff; width: 34px; height: 34px; border-radius: 8px; font-size: 18px; line-height: 1; flex: none; font-weight: 900; }
.close:hover { background: var(--box-2); }
.sheet-body { overflow-y: auto; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 22px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; touch-action: pan-y; }
.swatch { width: 66px; height: 55px; flex: none; border-radius: 6px; border: 3px solid var(--ink); }

.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; border: 3px solid var(--ink); background: #fff; padding: 6px; border-radius: 8px; font-family: var(--pixel); font-weight: 600; font-size: 15px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }

.form { display: flex; flex-direction: column; gap: 8px; }
.form label { font-family: var(--pixel); font-size: 19px; font-weight: 700; }
textarea, input[type="text"] { width: 100%; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 8px; padding: 9px 12px; font: inherit; font-weight: 700; background: #fff; color: var(--ink); resize: vertical; }
textarea::placeholder, input::placeholder { color: var(--ink-soft); opacity: .75; font-weight: 600; }
.form .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 3px solid var(--line); background: #fff; }
.item .txt { min-width: 0; }
.item .ach { font-weight: 800; overflow-wrap: anywhere; }
.item .meta { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.item canvas { background: var(--box-2); border-radius: 6px; }
.item.tap { cursor: pointer; text-align: left; width: 100%; }
.item.tap:hover { border-color: var(--ink); }
.empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 14px 6px; margin: 0; }
.section-title { font-family: var(--pixel); font-size: 17px; margin: 6px 0 -4px; color: var(--ink-soft); }

.progress { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.bar { height: 14px; border: 3px solid var(--ink); border-radius: 4px; overflow: hidden; background: #fff; }
.bar > i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--go) 0 6px, #4ea25e 6px 8px); }

.catalog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { border: 3px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.card:hover { border-color: var(--ink); }
.card > canvas:first-child { width: 100%; max-width: 150px; aspect-ratio: 6 / 5; border-radius: 4px; margin-bottom: 4px; }
.card b { font-family: var(--pixel); font-size: 16px; font-weight: 600; }
.card span { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.card .placed { color: var(--go); font-weight: 900; }

.resident-hero { display: flex; gap: 14px; align-items: center; }
.resident-hero canvas { background: var(--box-2); border-radius: 8px; flex: none; border: 3px solid var(--ink); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink-soft); font-weight: 700; }
.kv dd { margin: 0; font-weight: 800; overflow-wrap: anywhere; }

.modal-wrap { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.modal { border-radius: 14px; padding: 24px; width: min(400px, 100%); box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.modal h2 { margin: 0; font-family: var(--pixel); font-size: 26px; font-weight: 700; text-wrap: balance; }
.modal p { margin: 0; color: var(--ink-soft); }
.modal canvas { margin: 0 auto; }
.reveal canvas { animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .reveal canvas { animation: none; } }
.gift { font-family: var(--pixel); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }

#toasts { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 30; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-weight: 800; max-width: 100%; animation: tin .25s ease-out; box-shadow: 0 3px 0 rgba(40,48,64,.3); }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } }
.sync { font-size: 12px; color: var(--ink-soft); margin: 0; }
#insideBar { position: fixed; z-index: 6; top: calc(66px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; }
@media (max-width: 759px) { body.inside #sheet { max-height: 52%; } }
.tier { align-self: center; padding: 3px 12px; border: 3px solid var(--ink); border-radius: 6px; font-family: var(--pixel); font-size: 16px; font-weight: 700; }
.tier.t2 { background: #cfe2ff; color: #1d4fa8; }
.tier.t3 { background: #ffe27a; color: #7a4a00; animation: wob .5s ease-in-out infinite alternate; }
.reveal.t3 canvas { animation: popbig .9s cubic-bezier(.3,1.8,.5,1); }
@keyframes wob { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.08); } }
@keyframes popbig { from { transform: scale(.1) rotate(-25deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tier.t3, .reveal.t3 canvas { animation: none; } }
#btnPhone { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); border-radius: 10px; padding: 8px 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
#btnPhone .lbl { font-family: var(--pixel); font-size: 13px; }
@media (max-width: 759px) { #btnPhone .lbl { display: none; } #btnPhone { padding: 8px; } }
.phone-ic { width: 32px; height: 48px; display: block; }
#btnPhone.buzz .phone-ic { animation: shake .6s linear 1; }
#btnPhone.buzz::after { content: ""; position: absolute; inset: -10px; border-radius: 16px; pointer-events: none; background: radial-gradient(circle, rgba(255,250,210,.95), rgba(255,250,210,0) 70%); animation: flash 1s ease-out 1 forwards; }
@keyframes shake { 0%, 100% { transform: translateX(0) rotate(0); } 15% { transform: translateX(-2px) rotate(-6deg); } 30% { transform: translateX(2px) rotate(6deg); } 45% { transform: translateX(-2px) rotate(-4deg); } 60% { transform: translateX(2px) rotate(4deg); } 75% { transform: translateX(-1px); } }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #btnPhone.buzz .phone-ic { animation: none; } }
.phone { background: #2a2a38; border-radius: 22px; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 0 0 3px #44445a; }
.phone .empty { color: #c8cce0; }
.chat { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; align-items: flex-start; }
.msg canvas { background: #eef2f6; border-radius: 50%; flex: none; }
.msg > div { background: #fff; border-radius: 4px 14px 14px 14px; padding: 8px 12px; min-width: 0; }
.msg b { font-family: var(--pixel); font-size: 15px; font-weight: 600; }
.msg p { margin: 2px 0 4px; font-weight: 700; overflow-wrap: anywhere; }
.msg small { color: var(--ink-soft); font-size: 11px; }
.bdot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.hello { margin: 0; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 8px; background: #e2f4dc; font-weight: 800; }
.coin-ic { display: inline-block; width: 10px; height: 10px; background: #f0c040; border: 2px solid #a8741a; border-radius: 50%; box-shadow: inset -2px -2px 0 #d8a020; vertical-align: -1px; flex: none; }
.price { display: inline-flex; align-items: center; gap: 5px; font-weight: 900 !important; color: var(--ink) !important; font-size: 14px !important; }
.card.short { opacity: .55; }
.income { display: flex; align-items: center; gap: 6px; color: var(--ink); }
.gear { width: 16px; height: 16px; fill: var(--ink-soft); flex: none; }
.ic { width: 11px; height: 11px; fill: var(--ink); flex: none; align-self: center; }
@media (max-width: 480px) { .stat small { display: none; } #cityChip { gap: 9px; padding: 8px 12px; } }
.toggle { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 3px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--go); margin: 2px 0 0; flex: none; }
.toggle b { display: block; font-family: var(--pixel); font-size: 17px; font-weight: 600; }
.toggle small { display: block; color: var(--ink-soft); font-size: 13px; }
.gift-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 8px; background: repeating-linear-gradient(45deg, #fff4c8 0 8px, #ffe9a0 8px 16px); font-family: var(--pixel); font-size: 17px; flex-wrap: wrap; }
.news { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-weight: 800; }
.news li::before { content: "+ "; color: var(--go); font-family: var(--pixel); }

/* rondleiding: jouw eigen inwoner praat in een tekstvak bovenin */
#tut { position: fixed; z-index: 15; top: calc(68px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); box-sizing: border-box; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; animation: tin .25s ease-out; }
#tut[hidden] { display: none; }
body.inside #tut { top: calc(116px + env(safe-area-inset-top, 0px)); }
#tut > canvas { flex: none; border-radius: 8px; background: var(--box-2); }
.tut-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tut-main b { font-family: var(--pixel); font-size: 17px; }
.tut-main p { margin: 0; line-height: 1.4; min-height: 2.8em; cursor: pointer; }
.tut-main .tut-pic { align-self: center; }
.tut-main .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.tut-step { margin-right: auto; color: var(--ink-soft); font-size: 13px; }
.tut-glow { animation: tglow 1.1s ease-in-out infinite alternate; }
.tut-glow-text { animation: tglowt 1.1s ease-in-out infinite alternate; border-radius: 4px; }
@keyframes tglow { from { box-shadow: 0 0 0 3px var(--gold), 0 0 0 0 rgba(240, 192, 64, .6); } to { box-shadow: 0 0 0 3px var(--gold), 0 0 0 10px rgba(240, 192, 64, 0); } }
@keyframes tglowt { from { background: rgba(240, 192, 64, .55); } to { background: rgba(240, 192, 64, 0); } }
@media (prefers-reduced-motion: reduce) { #tut { animation: none; } .tut-glow { animation: none; box-shadow: 0 0 0 3px var(--gold); } .tut-glow-text { animation: none; background: rgba(240, 192, 64, .5); } }
@media (max-width: 480px) { #tut > canvas { width: 44px; height: 44px; } .tut-main p { font-size: 14px; } }
@media (max-width: 759px) { body.inside #tut { padding: 8px 10px; gap: 8px; } body.inside #tut > canvas { width: 36px; height: 36px; } body.inside .tut-main b { display: none; } body.inside .tut-main p { min-height: 0; font-size: 13.5px; } }
/* jezelf maken */
.creator canvas#creatorPrev { width: 252px; height: 138px; background: var(--box-2); border-radius: 10px; border: 3px solid var(--ink); }
.pickrow { display: flex; align-items: center; gap: 10px; justify-content: center; }
.pickrow span { min-width: 96px; }
.pickrow .btn { min-width: 44px; min-height: 36px; font-size: 18px; }
.swatches { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.swatches button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--ink); padding: 0; }
.swatches button[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 2px; }
.creator .row { display: flex; gap: 8px; justify-content: center; }

/* jubileum */
.flash { position: fixed; inset: 0; background: #fff; z-index: 25; pointer-events: none; animation: flash .8s ease-out forwards; }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .flash { animation-duration: .2s; } }
.photo-big { width: 100%; height: auto; border: 3px solid #c89820; border-radius: 6px; box-shadow: 0 0 0 3px #f0c040; background: #fff; }
.gift-banner.jub { background: #fff6d8; }
.photos-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 8px; color: var(--ink-soft); font-size: 14px; }
.album { max-height: calc(100dvh - 32px); overflow: auto; }
.album-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }

/* dieren, reset, collectie */
.btn.danger { background: #d03a30; color: #fff; }
.btn.danger:disabled { background: #c8a8a4; }
.gift.danger { color: #d03a30; }

.with-pet { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.pet-inline { display: inline-block; }
.kv dd canvas.pet-av { vertical-align: middle; margin-right: 6px; }
.catalog.mini { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.catalog.mini .card { padding: 8px 6px; }

.catalog.mini .card span { font-size: 12px; }

@media (max-width: 759px) { body.inside.panel-min #sheet .sheet-body { display: none; } body.inside.panel-min .sheet-head { border-bottom: 0; } }
.close.fold { font-size: 15px; }
#exportText { width: 100%; box-sizing: border-box; font: 12px/1.3 monospace; }
.steps { text-align: left; margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
</style>

    <span class="dot"></span>

  music: [["Koptelefoon", "headphones", "#ef476f", 1], ["Baret", "beret", "#222222", 1], ["Zonnebril", "sunglasses", "#111111", 1], ["Microfoon", "mic", "#2e3240", 2], ["Drumstokken", "drumsticks", "#e0b070", 2], ["Elektrische reuzengitaar", "bigguitar", "#e04848", 3]],
};
const TIER_NAMES = ["", "Gewoon", "Bijzonder", "Absurd", "Jubileum"];
const TIER_PHASE = [0, 1, 3, 5];
const tierOpen = phase => phase >= 5 ? 3 : phase >= 3 ? 2 : 1;
let forcedTier = 0;
// trekt een accessoire uit de niveaus die al vrij zijn; nog niet ontdekte krijgen voorrang
function rollAccessory(b, type) {
  const open = b ? tierOpen(shownPhase(b)) : 1, x = Math.random();
  let tier = open === 3 ? (x < 0.10 ? 3 : x < 0.40 ? 2 : 1) : open === 2 ? (x < 0.25 ? 2 : 1) : 1;
  if (forcedTier && forcedTier <= open) tier = forcedTier;
  const pool = ACCESSORIES[type].filter(a => (a[3] || 1) === tier);
  const found = new Set(state.residents.filter(r => r.type === type && r.accessory).map(r => r.accessory.name));
  const fresh = pool.filter(a => !found.has(a[0]));
  return pick(fresh.length ? fresh : pool);
}

// Provisorische inwonergrenzen voor de vijf ontwikkelingsfasen
const PHASES = [0, 3, 8, 15, 25];

/* ---------- Inwoners genereren ---------- */
const FIRST = ["Sanne","Daan","Lotte","Bram","Noor","Thijs","Fleur","Jesse","Isa","Ruben","Mila","Sem","Eva","Lars","Femke","Joep","Tess","Milan","Roos","Stijn","Lieke","Teun","Yara","Gijs","Anouk","Mees","Floor","Koen","Nina","Wout","Jasmijn","Hidde","Saar","Levi","Merel","Siem","Fenna","Otis","Zoë","Bas","Amira","Ilias","Mei","Omar","Sophie","Kees","Ayla","Finn","Hanna","Jip"];
const LAST = ["de Vries","Jansen","Bakker","Visser","Smit","Meijer","de Boer","Mulder","de Groot","Bos","Vos","Peters","Hendriks","van Dijk","Dekker","Brouwer","de Wit","Kok","Verhoeven","van Leeuwen","Willems","Hoekstra","Koster","Prins","Kuiper","Veenstra","Postma","Zwart","van der Berg","Blom"];
const SKINS = ["#f9d7b9", "#f1c27d", "#e0ac69", "#c68642", "#8d5524", "#5c3a21"];
const HAIRS = ["#2b1d14", "#5a3825", "#a0522d", "#d8a657", "#f2d16b", "#c94f2c", "#1b1b1b", "#9aa0a6", "#e889b5", "#5aa9e6"];
const SHIRTS = ["#e63946", "#f4a261", "#2a9d8f", "#457b9d", "#e9c46a", "#8338ec", "#ff6b9a", "#06d6a0", "#118ab2", "#ef476f", "#7bb662", "#f77f00", "#ffffff", "#6d597a"];
const PANTS = ["#3b4a6b", "#2f3e46", "#6b4f3a", "#4a4e69", "#264653", "#7b2d26", "#1d3557"];
const STYLES = ["short", "long", "bun", "spiky", "bald", "curly", "ponytail"];
const pick = a => a[Math.floor(Math.random() * a.length)];
const randName = () => pick(FIRST) + " " + pick(LAST);
const randLook = () => ({ skin: pick(SKINS), hair: pick(HAIRS), style: pick(STYLES), shirt: pick(SHIRTS), pants: pick(PANTS) });
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- Toestand ---------- */
let state = { cityName: "", buildings: [], residents: [] };
const LS_KEY = "milestown.v1";
function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && Array.isArray(s.buildings)) return s; } catch (e) {}
  return null;
}
let localTimer = 0;
function writeLocal() { clearTimeout(localTimer); localTimer = 0; try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function saveLocal() {
  clearTimeout(localTimer);
  localTimer = setTimeout(writeLocal, 250);
}
// bij het verlaten van de pagina meteen bewaren, zodat er niets verloren gaat
window.addEventListener("pagehide", () => { if (localTimer) writeLocal(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && localTimer) writeLocal(); });

/* ---------- Account en synchronisatie (Supabase) ---------- */
// de stad staat altijd op dit apparaat; met een account wordt hij ook in de cloud bewaard
const CFG = window.MILESTOWN || {};
const sb = window.supabase && CFG.supabaseUrl ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" } }) : null;
const store = { user: null, mode: "local", syncing: false, again: false, dirty: false, timer: 0 };
function saveCity() { state.updatedAt = Date.now(); saveLocal(); queueCloud(); }
function saveResident(r) { state.updatedAt = Date.now(); saveLocal(); queueCloud(); }
let syncText = "Je stad wordt op dit apparaat bewaard. Log in om hem ook in je account te bewaren.";
function setSync(t) { syncText = t; }
function normalizeState(s) {
  return { cityName: s.cityName || "", settings: s.settings || { daynight: true, weather: true }, coins: s.coins, coinTick: s.coinTick, coinFrac: s.coinFrac, decor: Array.isArray(s.decor) ? s.decor : [], cleared: Array.isArray(s.cleared) ? s.cleared : [], messages: Array.isArray(s.messages) ? s.messages : [], meAsked: !!s.meAsked, tutorial: s.tutorial || null, buildings: Array.isArray(s.buildings) ? s.buildings : [], residents: Array.isArray(s.residents) ? s.residents : [], updatedAt: s.updatedAt || 0, ownerId: s.ownerId || null };
}
function cloudPayload() { const { residents, updatedAt, ownerId, ...city } = state; return { city, residents }; }
function queueCloud() {
  if (store.mode !== "cloud") return;
  store.dirty = true; clearTimeout(store.timer); store.timer = setTimeout(pushCloud, 1200);
}
async function pushCloud() {
  if (!sb || !store.user) return;
  if (store.syncing) { store.again = true; return; }
  store.syncing = true; store.dirty = false;
  try {
    const { error } = await sb.from("cities").upsert({ user_id: store.user.id, data: cloudPayload(), updated_at: new Date(state.updatedAt || Date.now()).toISOString() });
    if (error) throw error;
    setSync("Je stad wordt automatisch in je account bewaard.");
  } catch (e) {
    console.warn("Opslaan in je account mislukt", e); store.dirty = true;
    setSync("Opslaan in je account lukte even niet. Je stad staat veilig op dit apparaat en wordt later bijgewerkt.");
  }
  store.syncing = false;
  if (store.again) { store.again = false; pushCloud(); }
}
window.addEventListener("online", () => { if (store.dirty) pushCloud(); });
async function pullCloud() {
  const { data, error } = await sb.from("cities").select("data, updated_at").eq("user_id", store.user.id).maybeSingle();
  if (error) throw error;
  return data;
}
function applyCloud(row) {
  const d = row.data || {};
  state = normalizeState({ ...(d.city || {}), residents: d.residents || [] });
  state.updatedAt = Date.parse(row.updated_at) || Date.now(); state.ownerId = store.user.id;
  writeLocal(); onStateReplaced();
}
// na inloggen: de nieuwste versie wint, zodat je op elk apparaat dezelfde stad ziet
async function startCloud(user) {
  store.user = user;
  const row = await pullCloud();
  const localHas = !!(state.cityName || state.buildings.length || state.residents.length);
  const remoteAt = row ? Date.parse(row.updated_at) || 0 : 0;
  store.mode = "cloud";
  if (row && (!localHas || state.ownerId !== user.id || remoteAt >= (state.updatedAt || 0))) applyCloud(row);
  else if (localHas) { state.ownerId = user.id; writeLocal(); await pushCloud(); }
  else state.ownerId = user.id;
  setSync("Je stad wordt automatisch in je account bewaard.");
  if (state.cityName) closeNameModalIfOpen();
}
// bij terugkomen in de app: haal een nieuwere versie van een ander apparaat op
document.addEventListener("visibilitychange", async () => {
  if (document.hidden || store.mode !== "cloud" || store.dirty || store.syncing) return;
  try { const row = await pullCloud(); if (row && (Date.parse(row.updated_at) || 0) > (state.updatedAt || 0) + 1000) { applyCloud(row); toast("Je stad is bijgewerkt vanaf een ander apparaat."); } } catch (e) {}
});
async function connectAccount() {
  if (!sb) { setSync("Inloggen is hier niet beschikbaar. Je stad wordt op dit apparaat bewaard."); return; }
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) await startCloud(data.session.user);
  } catch (e) { console.warn("Account niet bereikbaar", e); setSync("Je account is even niet bereikbaar. Je stad staat veilig op dit apparaat."); }
}
const accountReady = () => Promise.race([connectAccount(), new Promise(r => setTimeout(r, 5000))]);

/* ---------- Inloggen met e-mail en wachtwoord ---------- */
function openLogin(after, mode = "in") {
  if (!sb) { toast("Inloggen is hier niet beschikbaar."); return; }
  const signup = mode === "up";
  modal(`<form class="modal" id="loginForm"><div class="gift">${signup ? "Account maken" : "Inloggen"}</div><h2>${signup ? "Maak je account" : "Je stad in je account"}</h2>
    <p>${signup ? "Kies een e-mailadres en een wachtwoord. Zo staat je stad veilig in je account en zie je hem op al je apparaten." : "Log in met je e-mailadres en wachtwoord."}</p>
    <input type="email" id="loginEmail" autocomplete="email" placeholder="jij@voorbeeld.nl" aria-label="E-mailadres" required>
    <input type="password" id="loginPw" autocomplete="${signup ? "new-password" : "current-password"}" placeholder="Wachtwoord${signup ? " (minstens 8 tekens)" : ""}" aria-label="Wachtwoord" minlength="${signup ? 8 : 1}" required>
    <button class="btn primary" type="submit" id="loginGo">${signup ? "Account maken" : "Inloggen"}</button>
    <button class="btn ghost small" type="button" id="loginSwitch">${signup ? "Ik heb al een account" : "Nog geen account? Maak er een"}</button>
    ${signup ? "" : `<button class="btn ghost small" type="button" id="loginForgot">Wachtwoord vergeten</button>`}
    <button class="btn ghost small" type="button" id="loginNo">Nu niet</button></form>`, () => {
    $("loginEmail").focus();
    $("loginNo").onclick = closeModal;
    $("loginSwitch").onclick = () => openLogin(after, signup ? "in" : "up");
    if ($("loginForgot")) $("loginForgot").onclick = () => forgotPassword($("loginEmail").value.trim());
    $("loginForm").onsubmit = async e => {
      e.preventDefault();
      const email = $("loginEmail").value.trim(), password = $("loginPw").value; if (!email || !password) return;
      const go = $("loginGo"), label = go.textContent; go.disabled = true; go.textContent = "Bezig…";
      const { data, error } = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
      if (error || !data.user) {
        go.disabled = false; go.textContent = label;
        const msg = !error ? "Dat lukte niet. Probeer het nog eens." : /already registered|already exists/i.test(error.message) ? "Er bestaat al een account met dit e-mailadres. Log in." : /invalid login|credentials/i.test(error.message) ? "E-mailadres of wachtwoord klopt niet." : /password/i.test(error.message) ? "Kies een wachtwoord van minstens 8 tekens." : error.status === 429 ? "Even te vaak geprobeerd. Wacht een paar minuten." : "Dat lukte niet. Controleer je gegevens en probeer het opnieuw.";
        toast(msg); return;
      }
      if (!data.session) { closeModal(); toast("Bevestig eerst je e-mailadres via de mail die je kreeg, en log daarna in."); return; }
      await loggedIn(data.user, after);
    };
  });
}
async function loggedIn(user, after) {
  closeModal();
  try { await startCloud(user); toast("Ingelogd! Je stad wordt nu in je account bewaard."); } catch (err) { toast("Ingelogd, maar je stad ophalen lukte even niet."); }
  refreshHud();
  if (!state.cityName) showNameModal();
  after && after();
}
async function forgotPassword(email) {
  if (!email) { toast("Vul eerst je e-mailadres in."); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  toast(error ? (error.status === 429 ? "Er is net al een mail verstuurd. Probeer het later opnieuw." : "Versturen lukte niet. Probeer het later opnieuw.") : "Als dit e-mailadres een account heeft, krijg je een mail met een link om een nieuw wachtwoord te kiezen.");
}
// via de link uit de wachtwoordmail: een nieuw wachtwoord kiezen
function openNewPassword() {
  modal(`<form class="modal" id="pwForm"><div class="gift">Nieuw wachtwoord</div><h2>Kies een nieuw wachtwoord</h2>

/* ---------- Meldingen op je telefoon ---------- */
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function keyBytes(b64) { const s = (b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"), raw = atob(s); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function pushState() {
  if (!pushSupported()) return "unsupported";
  try { const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription(); return sub && Notification.permission === "granted" ? "on" : "off"; } catch (e) { return "off"; }
}
function showInstallHelp() {
  modal(`<div class="modal"><div class="gift">Installeren</div><h2>Zet Milestown op je beginscherm</h2>
    <p>Op een iPhone werken meldingen alleen als de app op je beginscherm staat.</p>
    <ol class="steps"><li>Tik onderin Safari op <b>Deel</b> (het vierkantje met de pijl omhoog).</li><li>Kies <b>Zet op beginscherm</b>.</li><li>Open Milestown vanaf je beginscherm en zet daar de meldingen aan.</li></ol>
    <button class="btn primary" id="helpOk" type="button">Begrepen</button></div>`, () => { $("helpOk").onclick = closeModal; $("helpOk").focus(); });
}
async function enablePush() {
  if (!store.user) { openLogin(enablePush); return; }
  if (isIOS() && !isStandalone()) { showInstallHelp(); return; }
  if (!pushSupported() || !CFG.vapidPublicKey) { toast("Deze browser ondersteunt geen meldingen."); return; }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { toast("Meldingen staan uit. Je kunt ze later alsnog aanzetten in je instellingen."); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(CFG.vapidPublicKey) });
    const j = sub.toJSON();
    const { error } = await sb.from("push_subscriptions").upsert({ endpoint: j.endpoint, user_id: store.user.id, subscription: j });
    if (error) throw error;
    toast("Meldingen staan aan. Per taak krijg je hooguit één rustig berichtje.");
  } catch (e) { console.warn("Meldingen aanzetten mislukt", e); toast("Meldingen aanzetten lukte niet. Probeer het later nog eens."); }
  if (sheetView && sheetView.type === "city") openCity();
}
async function disablePush(quiet) {
  if (!pushSupported()) return;
  const reg = await navigator.serviceWorker.getRegistration(); const sub = reg && await reg.pushManager.getSubscription();
  if (sub) { if (sb && store.user) await sb.from("push_subscriptions").delete().eq("endpoint", sub.endpoint); await sub.unsubscribe(); }
  if (!quiet) { toast("Meldingen staan uit op dit apparaat."); if (sheetView && sheetView.type === "city") openCity(); }
}

/* ---------- Stad importeren (uit een exportbestand) ---------- */
function importCity() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let j; try { j = JSON.parse(await f.text()); } catch (e) { toast("Dit bestand kan ik niet lezen."); return; }
    if (!j || !["milestown", "prestatiestad"].includes(j.app) || !j.city || !Array.isArray(j.residents)) { toast("Dit is geen Milestown-bestand."); return; }
    const n = j.residents.filter(r => r.status === "resident").length;
    modal(`<div class="modal"><div class="gift">Importeren</div><h2>${esc(j.city.cityName || "Je stad")} importeren?</h2>
      <p>${j.city.buildings ? j.city.buildings.length : 0} gebouwen en ${n} inwoners. Dit vervangt de stad die nu in de app staat.</p>
      <button class="btn primary" id="impGo" type="button">Importeren</button><button class="btn ghost small" id="impNo" type="button">Annuleren</button></div>`, () => {
      $("impNo").onclick = closeModal;
      $("impGo").onclick = () => {
        state = normalizeState({ ...j.city, residents: j.residents, ownerId: store.user ? store.user.id : null });
        closeModal(); hideTutorial(); $("sheet").hidden = true; sheetView = null;
        onStateReplaced(); saveCity(); writeLocal(); if (store.mode === "cloud") pushCloud();
        showBars(); toast(`Welkom terug in ${state.cityName || "je stad"}!`);
      };
    });
  };
  inp.click();
}

const toWorld = (sx, sy) => ({ x: (sx - W / 2) / cam.z + cam.x, y: (sy - H / 2) / cam.z + cam.y });

function openPhone(tab = "msg") {
  const msgs = (state.messages || []).slice().sort((a, b) => a.at - b.at);
  const tasks = state.residents.filter(r => r.status === "future").sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || ""));
  const byId = new Map(state.residents.map(r => [r.id, r]));
  openSheet(`
    <div class="sheet-head"><div class="grow"><h2>Telefoon</h2><div class="sub">Berichtjes van je toekomstige inwoners</div></div><button class="close" data-close aria-label="Sluiten">×</button></div>
    <div class="sheet-body">
      <div class="phone">
        <div class="tabs" role="tablist"><button role="tab" id="phMsg" aria-selected="${tab === "msg"}">Berichten</button><button role="tab" id="phTask" aria-selected="${tab === "task"}">Taken${tasks.length ? ` (${tasks.length})` : ""}</button></div>
        ${tab === "msg" ? (msgs.length ? `<ul class="chat">${msgs.map(m => { const r = byId.get(m.resId); return `
          <li class="msg">${r ? `<span data-avatar="${r.id}" data-size="36"></span>` : ""}<div><b>${esc(r ? r.name : "Een inwoner")}</b><p>${esc(m.text)}</p><small>${esc(fmtDate(new Date(m.at).toISOString()))}</small></div></li>`; }).join("")}</ul>`
          : `<p class="empty">Nog geen berichtjes. Je toekomstige inwoners sturen hier soms een vriendelijk berichtje.</p>`)
        : (tasks.length ? `<ul class="list">${tasks.map(r => { const d = DEF[r.type]; return `
          <li class="item"><span data-avatar="${r.id}"></span><div class="txt"><div class="ach">${esc(r.text)}</div><div class="meta"><i class="bdot" style="background:${d ? d.accent : "#888"}"></i>${esc(d ? d.n : "")} · ${esc(r.name)} wacht</div></div><button class="btn small primary" data-done="${r.id}" type="button">Voltooid</button></li>`; }).join("")}</ul>`
          : `<p class="empty">Geen openstaande taken. Een taak zet je klaar in een gebouw, onder Taken.</p>`)}
      </div>
    </div>`, { type: "phone", tab });
  $("phMsg").onclick = () => openPhone("msg");
  $("phTask").onclick = () => openPhone("task");
  $("sheet").querySelectorAll("[data-done]").forEach(btn => btn.onclick = () => completeTask(btn.dataset.done));
}

  modal(`<div class="modal album"><div class="gift">Fotoalbum</div><span id="albPhoto"></span><h2>${cap(ordinal(n))} jubileum</h2><p>${esc(DEF[b.type].n)} · ${esc(fmtDate(ph.date))}</p>
    <ul class="album-list">${rs.map(r => `<li><span data-alb="${r.id}"></span><div><b>${esc(r.name)}</b><span>„${esc(r.text)}"</span><small>Woonde hier vanaf ${esc(fmtDate(r.movedIn))}${r.accessory ? " · " + esc(r.accessory.name) : ""}${r.pet ? " · met " + esc(petLabel(r.pet)) : ""}</small></div></li>`).join("")}</ul>
    <button class="btn primary" id="albOk" type="button">Sluiten</button></div>`, root => {
    const c = photoCanvas(b, ph), [cc, g] = mk(c.width, c.height); g.drawImage(c, 0, 0); cc.className = "photo-big"; $("albPhoto").replaceWith(cc);
    root.querySelectorAll("[data-alb]").forEach(el => { const r = state.residents.find(x => x.id === el.dataset.alb); if (r) el.replaceWith(avatar(r, 40, 0)); });
    $("albOk").onclick = closeModal; $("albOk").focus();
  });
}

/* ---------- Jijzelf als eerste inwoner ---------- */
const SELF_COLORS = ["#3a6ad8", "#e04848", "#48a060", "#f0c040", "#9b5de5", "#ff7eb6", "#2a9d8f", "#e8783a"];
const meRes = () => state.residents.find(r => r.self);
function selfLine() {
  const n = residentsLive().length, city = state.cityName || "onze stad";
  if (n <= 2) return pick(["Zo trots dat je bent begonnen!", "Hier begint het. Ik ben benieuwd wat we gaan bouwen!", "Weet je nog, toen hier alleen gras was? Nou ja, dat is nog maar net zo.", "Elke prestatie telt, groot of klein."]);
  return pick(["Zo trots dat je bent begonnen!", "Kijk eens hoe ver we al zijn gekomen.", "Weet je nog, toen hier alleen gras was?", `Al ${n} inwoners in ${city}. Mooi hè?`, "Elke prestatie telt, groot of klein.", "Fijn dat je er weer bent!", ...(state.buildings.some(b => b.photos && b.photos.length) ? ["Ik sta op elke jubileumfoto. Mooi hè?"] : [])]);
}
function sayMe(text) {
  const me = meRes(); if (!me) return;
  const w = walkers.find(x => x.r.id === me.id);
  if (w) { w.inside = false; w.bubble = { text, until: now + 7 }; }
  toast(`${me.name.split(" ")[0]}: ${text}`);
}
function startDateIso() {
  const ds = state.residents.map(r => r.movedIn || r.createdAt).filter(Boolean).sort();
  return ds[0] || new Date().toISOString();
}
function showCreator({ edit = false, onDone, onLater } = {}) {
  const me = meRes();
  const look = me ? { ...me.look } : { skin: SKINS[1], hair: HAIRS[0], style: "short", shirt: SELF_COLORS[0] };
  const lists = { skin: SKINS, hair: HAIRS, style: STYLES };
  const labels = { skin: "Huid", hair: "Haarkleur", style: "Kapsel" };
  modal(`<form class="modal creator" id="creatorForm">
    <div class="gift">${edit ? "Jezelf aanpassen" : "Jij bent de eerste inwoner"}</div>
    <canvas id="creatorPrev" width="168" height="92"></canvas>
    <h2>${edit ? "Zo zie jij eruit" : "Wie ben jij?"}</h2>
    ${edit ? "" : `<p>Elke stad begint met iemand die durft te beginnen. Dat ben jij!</p>`}
    <input type="text" id="meName" maxlength="30" placeholder="Je naam" aria-label="Je naam" value="${esc(me ? me.name : "")}">
    ${Object.keys(lists).map(k => `<div class="pickrow"><button type="button" class="btn small" data-prev="${k}" aria-label="Vorige ${labels[k].toLowerCase()}">‹</button><span>${labels[k]}</span><button type="button" class="btn small" data-next="${k}" aria-label="Volgende ${labels[k].toLowerCase()}">›</button></div>`).join("")}
    <div class="swatches" role="group" aria-label="Kleur van je kleding">${SELF_COLORS.map(c => `<button type="button" data-shirt="${c}" style="background:${c}" aria-label="Kledingkleur"></button>`).join("")}</div>
    <div class="row"><button type="button" class="btn ghost" id="meRandom">Verrassen</button><button type="submit" class="btn primary">Dit ben ik!</button></div>
    ${onLater ? `<button type="button" class="btn ghost small" id="meLater">Nu niet</button>` : ""}
  </form>`, () => {
    const prev = $("creatorPrev"), g = prev.getContext("2d");
    const draw = () => {
      g.clearRect(0, 0, prev.width, prev.height); g.imageSmoothingEnabled = false;
      [0, 2, 1].forEach((d, i) => g.drawImage(trainer(look, "self", null, d, 0), i * 56 - 2, -10, 60, 92));
      document.querySelectorAll("[data-shirt]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.shirt === look.shirt)));
    };
    const step = (k, dir) => { const L = lists[k], i = L.indexOf(look[k]); look[k] = L[(i + dir + L.length) % L.length]; draw(); };
    document.querySelectorAll("[data-prev]").forEach(b => b.onclick = () => step(b.dataset.prev, -1));
    document.querySelectorAll("[data-next]").forEach(b => b.onclick = () => step(b.dataset.next, 1));
    document.querySelectorAll("[data-shirt]").forEach(b => b.onclick = () => { look.shirt = b.dataset.shirt; draw(); });
    $("meRandom").onclick = () => { look.skin = pick(SKINS); look.hair = pick(HAIRS); look.style = pick(STYLES); look.shirt = pick(SELF_COLORS); draw(); };
    if ($("meLater")) $("meLater").onclick = () => { closeModal(); onLater(); };
    draw();
    if (!edit) $("meName").focus();
    $("creatorForm").onsubmit = e => {
      e.preventDefault();
      const name = $("meName").value.trim();
      if (!name) { $("meName").focus(); toast("Vul je naam in, dan weet de stad hoe je heet."); return; }
      let r = meRes();
      if (r) { r.name = name; r.look = look; }
      else {
        const iso = startDateIso();
        r = { id: uid("r_"), self: true, type: "self", buildingId: null, text: "Begonnen aan mijn eigen stad", status: "resident", name, look, createdAt: iso, movedIn: iso, accessory: null };
        state.residents.push(r);
      }
      saveResident(r); state.meAsked = true; saveCity();
      pickVisible(); refreshHud(); closeModal();
      if (!edit) setTimeout(() => sayMe("Zo trots dat je bent begonnen!"), 400); else toast("Opgeslagen");
      onDone && onDone();
    };
  });
}
function maybeAskMe() {
  if (!state.cityName || meRes() || state.meAsked) return;
  if ($("modalRoot").innerHTML || inside || trans) { setTimeout(maybeAskMe, 2500); return; }
  modal(`<div class="modal"><div class="gift">Nieuw</div><h2>Jij in je eigen stad</h2><p>Je kunt nu jezelf toevoegen als allereerste inwoner van ${esc(state.cityName)}. Jij bent tenslotte degene die begonnen is.</p><button class="btn primary" id="askYes" type="button">Ja, maak mij</button><button class="btn ghost small" id="askNo" type="button">Nu niet</button></div>`, () => {
    $("askYes").onclick = () => showCreator({ onDone: () => { if (!(state.tutorial && state.tutorial.done)) startTutorial(0); }, onLater: () => { state.meAsked = true; saveCity(); } });
    $("askNo").onclick = () => { state.meAsked = true; saveCity(); closeModal(); };
  });
}

/* ---------- Rondleiding ---------- */
const TUT = [
  { say: () => `Hoi! Ik ben ${guideName()}. Ik woon hier als eerste, dankzij jou. Zal ik je even rondleiden door ${state.cityName || "je stad"}?`, ok: "Ja, graag" },
  { say: () => "Begin met een gebouw. Elk gebouw hoort bij een deel van je leven, zoals sport, studie of je huishouden. Tik op Bouwen en kies er een.", target: "#btnBuild", wait: "building", done: () => state.buildings.length > 0 },
  { say: () => "Tik op een gebouw om naar binnen te gaan. Daar vul je in wat je hebt bereikt. Groot of klein, het telt allemaal. Voor elke prestatie verhuist er iemand naar onze stad!", wait: "achievement", done: () => state.residents.some(r => r.status === "resident" && !r.self) },
  { say: () => "In een gebouw kun je ook taken klaarzetten. Dan wacht er alvast een toekomstige inwoner op je. In het telefoontje zie je al je taken bij elkaar. Soms stuurt iemand je een lief berichtje, zonder haast.", target: "#btnPhone" },
  { say: () => "Hoe meer inwoners een gebouw heeft, hoe groter het wordt. Bij een nieuwe fase pakken we het in als cadeau. Dat pak jij zelf uit, wanneer jij wilt.", pic: "gift" },
  { say: () => "Gebouwen met inwoners verdienen elke dag munten, ook als de app dicht is. Daarmee koop je decoraties bij Bouwen, en binnen meubels met Inrichten.", target: "#coinCount" },
  { say: () => "Met Verplaatsen zet je gebouwen en decoraties ergens anders neer. Staat er een boom in de weg? Tik erop en haal hem weg.", target: "#btnMove" },
  { say: () => "Voltooi je een taak, dan neemt de nieuwe inwoner een verrassingsaccessoire mee. In elk gebouw staat je collectie. Hoe groter het gebouw, hoe gekker de accessoires!", pic: "acc" },
  { say: () => "De stad volgt de echte tijd en het weer. Tik op de naam van de stad voor de instellingen. Daar kun je deze rondleiding ook opnieuw bekijken.", target: "#cityChip" },
  { say: () => "Is een gebouw helemaal af, in fase 5? Dan kun je een jubileum vieren. Het begint weer klein, maar krijgt een kaarsje op het dak en binnen een groepsfoto. Niemand verdwijnt!", pic: "cake" },
  { say: () => "Dat was het! Ik loop gewoon rond in de stad. Ik ben nu al trots op je.", ok: "Klaar" },
];
const guideName = () => { const me = meRes(); return me ? me.name.split(" ")[0] : "je gids"; };
let tutTimer = 0, tutGlowEl = null;
const tutActive = () => state.tutorial && !state.tutorial.done && typeof state.tutorial.step === "number";
function startTutorial(step = 0) { state.tutorial = { step, done: false }; saveCity(); showTutorial(); }
function endTutorial() { state.tutorial = { step: TUT.length, done: true }; saveCity(); hideTutorial(); }
function hideTutorial() { const el = $("tut"); if (el) el.hidden = true; if (tutGlowEl) tutGlowEl.classList.remove("tut-glow"); tutGlowEl = null; clearInterval(tutTimer); }
function showTutorial() {
  if (!tutActive()) return hideTutorial();
  const i = state.tutorial.step, S = TUT[i];
  if (!S) return endTutorial();
  const el = $("tut"); el.hidden = false;
  const waiting = S.wait && !(S.done && S.done());
  const me = meRes();
  el.innerHTML = `<span class="tut-face"></span><div class="tut-main"><b>${esc(guideName())}</b><p id="tutText"></p>${S.pic ? `<span class="tut-pic"></span>` : ""}
    <div class="row">${i === 0 || i === TUT.length - 1 ? "" : `<span class="tut-step">${i} van ${TUT.length - 2}</span>`}
    ${i < TUT.length - 1 ? `<button type="button" class="btn ghost small" id="tutSkip">Overslaan</button>` : ""}
    <button type="button" class="btn ${waiting ? "ghost" : "primary"} small" id="tutNext">${S.ok || (waiting ? "Sla deze stap over" : "Verder")}</button></div></div>`;
  if (me) el.querySelector(".tut-face").replaceWith(avatar(me, 56, 0));
  else el.querySelector(".tut-face").remove();
  if (S.pic) {
    const c = S.pic === "cake" ? (() => { const [cc, gg] = mk(40, 30); drawCandles(gg, 16, 28, 3, 0.3); return cc; })() : S.pic === "gift" ? giftSprite("gym", 2) : trainer({ skin: "#f2c49a", hair: "#c84830", style: "spiky" }, "gym", { kind: "muscles", color: "" }, 0, 0);
    const [cv2, g] = mk(c.width, c.height); g.drawImage(c, 0, 0); cv2.className = "tut-pic";
    const z = Math.max(1, Math.min(2, Math.floor(84 / c.height))); cv2.style.width = c.width * z + "px"; cv2.style.height = c.height * z + "px";
    el.querySelector(".tut-pic").replaceWith(cv2);
  }
  const text = S.say(), p = $("tutText");
  clearInterval(tutTimer);
  if (reduceMotion()) p.textContent = text;
  else { let n = 0; tutTimer = setInterval(() => { n += 2; p.textContent = text.slice(0, n); if (n >= text.length) clearInterval(tutTimer); }, 22); p.onclick = () => { clearInterval(tutTimer); p.textContent = text; }; }
  if (tutGlowEl) tutGlowEl.classList.remove("tut-glow");
  tutGlowEl = S.target ? document.querySelector(S.target) : null;
  if (tutGlowEl) tutGlowEl.classList.add(S.target === "#coinCount" ? "tut-glow-text" : "tut-glow");
  $("tutNext").onclick = () => nextTut();
  if ($("tutSkip")) $("tutSkip").onclick = () => { endTutorial(); toast("Je kunt de rondleiding later opnieuw bekijken via de instellingen."); };
}
function nextTut() { if (!tutActive()) return; state.tutorial.step++; saveCity(); if (state.tutorial.step >= TUT.length) endTutorial(); else showTutorial(); }
function tutEvent(ev) { if (tutActive() && TUT[state.tutorial.step].wait === ev) setTimeout(() => { if (tutActive() && TUT[state.tutorial.step].wait === ev) nextTut(); }, 1500); }


/* ---------- Opstarten ---------- */
function onStateReplaced() {
  normalizeBuildings(); ensureSeen(); rebuildDecor(); const crowd = fixCrowding(); const left = moveOutAlumni(); rebuildPaths();
  if (crowd || left) saveCity(); walkers = []; pickVisible(); refreshHud();
  const c = state.buildings.length ? plaza : { x: 0, y: 0 };
  cam.x = c.x; cam.y = c.y - 60;
  if (sheetView) rerender();
}
const local = loadLocal();
if (local) state = normalizeState(local);
cam.z = defaultZoom();
onStateReplaced();
showBars();
if (!state.cityName) showNameModal();
requestAnimationFrame(frame);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(e => console.warn("Service worker", e));
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.open === "phone") openPhone("msg"); });
const openPhoneOnStart = new URLSearchParams(location.search).has("telefoon");
if (openPhoneOnStart) history.replaceState(null, "", location.pathname);
accountReady().finally(() => {
  ensureSeen();
  const earned = settleCoins(); saveCity(); refreshHud();
  if (earned > 0 && state.cityName) showEarned(earned);
  setTimeout(checkPings, 1500);
  setTimeout(maybeAskMe, 1800);
  if (openPhoneOnStart && state.cityName) setTimeout(() => openPhone("msg"), 600);
  if (tutActive()) showTutorial(); else hideTutorial();
  setInterval(() => { if (settleCoins() > 0) saveCity(); checkPings(); }, 60000);
});
})();
</script>
